[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
verbosity = 2
gas_reports = ["SimpleBank"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true
call_override = false

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 128, depth = 64 }

[fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
