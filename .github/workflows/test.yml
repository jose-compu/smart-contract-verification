name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: |
          set -euo pipefail
          forge coverage --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import re
          import sys

          text = open("coverage-summary.txt").read()
          rows = [line for line in text.splitlines() if "Total" in line and "%" in line]
          if not rows:
              sys.exit("coverage summary Total row not found")
          pcts = re.findall(r"(\d+\.\d+)%", rows[-1])
          if len(pcts) < 4 or any(p != "100.00" for p in pcts[:4]):
              sys.exit(f"coverage is not 100% on all metrics: {rows[-1]}")
          print("coverage 100% line/statement/branch/function")
          PY

  certora:
    name: Certora CVL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CERTORAKEY: ${{ secrets.CERTORAKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certora-cli and solc 0.8.24
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install certora-cli solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
          certoraRun --version
          solc --version

      - name: Typecheck SimpleBank CVL spec
        run: certoraRun verification/certora/SimpleBank.conf --compilation_steps_only

      - name: Prove SimpleBank CVL rules
        if: env.CERTORAKEY != ''
        run: certoraRun verification/certora/SimpleBank.conf
