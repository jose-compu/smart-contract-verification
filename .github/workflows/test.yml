name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: |
          set -euo pipefail
          forge coverage --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import re
          import sys

          text = open("coverage-summary.txt").read()
          rows = [line for line in text.splitlines() if "Total" in line and "%" in line]
          if not rows:
              sys.exit("coverage summary Total row not found")
          pcts = re.findall(r"(\d+\.\d+)%", rows[-1])
          if len(pcts) < 4 or any(p != "100.00" for p in pcts[:4]):
              sys.exit(f"coverage is not 100% on all metrics: {rows[-1]}")
          print("coverage 100% line/statement/branch/function")
          PY

  lean:
    name: Lean 4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build SimpleBank Lean model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          build: "true"
          test: "false"
          lint: "false"

  isabelle:
    name: Isabelle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Isabelle 2025-2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/isabelle.tar.gz" \
            https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
          sudo tar -xzf "$RUNNER_TEMP/isabelle.tar.gz" -C /opt
          echo /opt/Isabelle2025-2/bin >> "$GITHUB_PATH"
          /opt/Isabelle2025-2/bin/isabelle version

      - name: Check SimpleBank
        run: verification/isabelle/run.sh
