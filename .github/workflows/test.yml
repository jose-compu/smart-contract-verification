name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: |
          set -euo pipefail
          forge coverage --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import re
          import sys

          text = open("coverage-summary.txt").read()
          rows = [line for line in text.splitlines() if "Total" in line and "%" in line]
          if not rows:
              sys.exit("coverage summary Total row not found")
          pcts = re.findall(r"(\d+\.\d+)%", rows[-1])
          if len(pcts) < 4 or any(p != "100.00" for p in pcts[:4]):
              sys.exit(f"coverage is not 100% on all metrics: {rows[-1]}")
          print("coverage 100% line/statement/branch/function")
          PY

  lean:
    name: Lean 4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build SimpleBank Lean model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          build: "true"
          test: "false"
          lint: "false"

  smtchecker:
    name: SMTChecker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install solc 0.8.24 and z3 4.12.2
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/solc" \
            https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x "$RUNNER_TEMP/solc"
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" \
            https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP/z3src"
          z3bin=$(find "$RUNNER_TEMP/z3src" -type f -name z3 -print -quit)
          z3lib=$(find "$RUNNER_TEMP/z3src" -type f -name libz3.so -print -quit)
          test -n "$z3bin"
          test -n "$z3lib"
          # solc calls dlmopen("libz3.so.4.12"). That lookup uses the default
          # linker directories, not LD_LIBRARY_PATH, and ldconfig indexes the SONAME.
          sudo cp "$z3lib" /usr/lib/libz3.so.4.12
          sudo cp "$z3lib" /usr/lib/x86_64-linux-gnu/libz3.so.4.12
          sudo ldconfig
          ldconfig -p | grep z3
          cat > "$RUNNER_TEMP/z3load.c" <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void) {
            void *h = dlmopen(LM_ID_NEWLM, "libz3.so.4.12", RTLD_NOW);
            if (!h) {
              fprintf(stderr, "dlmopen: %s\n", dlerror());
              return 1;
            }
            printf("dlmopen libz3.so.4.12 ok\n");
            return 0;
          }
          EOF
          gcc -o "$RUNNER_TEMP/z3load" "$RUNNER_TEMP/z3load.c" -ldl
          "$RUNNER_TEMP/z3load"
          echo "$(dirname "$z3bin")" >> "$GITHUB_PATH"
          echo "SOLC=$RUNNER_TEMP/solc" >> "$GITHUB_ENV"

      - name: Prove SimpleBank assertions
        run: verification/smtchecker/run.sh
