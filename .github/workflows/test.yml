name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: |
          set -euo pipefail
          forge coverage --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import re
          import sys

          text = open("coverage-summary.txt").read()
          rows = [line for line in text.splitlines() if "Total" in line and "%" in line]
          if not rows:
              sys.exit("coverage summary Total row not found")
          pcts = re.findall(r"(\d+\.\d+)%", rows[-1])
          if len(pcts) < 4 or any(p != "100.00" for p in pcts[:4]):
              sys.exit(f"coverage is not 100% on all metrics: {rows[-1]}")
          print("coverage 100% line/statement/branch/function")
          PY

  lean:
    name: Lean 4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build SimpleBank Lean model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          build: "true"
          test: "false"
          lint: "false"

  coq:
    name: Coq
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the plain vault and the coq-evm embedding
        uses: coq-community/docker-coq-action@v1
        with:
          custom_image: coqorg/coq:8.20
          custom_script: |
            set -eu
            make -C verification/coq
            make -C verification/evm-coq
