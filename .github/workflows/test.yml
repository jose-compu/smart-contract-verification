name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: |
          set -euo pipefail
          forge coverage --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import re
          import sys

          text = open("coverage-summary.txt").read()
          rows = [line for line in text.splitlines() if "Total" in line and "%" in line]
          if not rows:
              sys.exit("coverage summary Total row not found")
          pcts = re.findall(r"(\d+\.\d+)%", rows[-1])
          if len(pcts) < 4 or any(p != "100.00" for p in pcts[:4]):
              sys.exit(f"coverage is not 100% on all metrics: {rows[-1]}")
          print("coverage 100% line/statement/branch/function")
          PY

  lean:
    name: Lean 4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build SimpleBank Lean model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          build: "true"
          test: "false"
          lint: "false"

  why3:
    name: Why3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Why3 1.8.2 and Alt-Ergo 2.6.4
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing --bare --yes --no-setup
          opam switch create ci ocaml-base-compiler.5.3.0
          eval "$(opam env --switch ci --set-switch)"
          opam install why3.1.8.2 alt-ergo.2.6.4 --yes --confirm-level=unsafe-yes
          echo "$(opam var bin)" >> "$GITHUB_PATH"
          why3 --version
          alt-ergo --version
          why3 config detect

      - name: Prove SimpleBank
        run: verification/why3/run.sh
